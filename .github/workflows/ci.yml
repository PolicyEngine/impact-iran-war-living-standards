name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The `uk` extra is not installed: the private managed dataset is not
      # available to CI, so the integration tests skip themselves and the unit
      # tests run against synthetic households. Install policyengine[uk] and
      # run `pytest tests/test_integration.py` locally instead.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -v

  lockfile:
    name: Lockfile is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Fails if requirements.lock no longer satisfies pyproject.toml, so a
      # dependency change cannot land without a regenerated lock — and the
      # lock's hash is part of the committed output's staleness signal.
      #
      # The committed lock is copied to the output path first so uv treats its
      # pins as preferences. Without that, uv resolves from scratch and the
      # check fails whenever any transitive dependency publishes a new
      # release, which says nothing about this repository.
      - name: Check lock satisfies pyproject
        run: |
          cp requirements.lock /tmp/requirements.lock
          uv pip compile pyproject.toml --extra uk --extra dev --python-version 3.13 -o /tmp/requirements.lock --quiet
          # Compare pins only: uv's header records the output path it was given.
          diff -u <(grep -v '^#' requirements.lock) <(grep -v '^#' /tmp/requirements.lock)

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
