name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The `uk` extra is not installed: the private managed dataset is not
      # available to CI, so the integration tests skip themselves and the unit
      # tests run against synthetic households. Install policyengine[uk] and
      # run `pytest tests/test_integration.py` locally instead.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -v

  dashboard:
    name: Dashboard lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
