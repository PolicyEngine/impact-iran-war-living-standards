[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-price-shock-impact"
version = "0.1.0"
description = "Analysis of how energy price shocks would impact UK living standards using PolicyEngine microsimulation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "microdf-python",
]

[project.optional-dependencies]
# policyengine.py is the only modelling dependency: the `uk` extra pulls the
# UK country package that `policyengine.tax_benefit_models.uk` needs, and the
# release bundle certifies the matching policyengine-uk version. Do not pin
# policyengine-uk directly — the bundle owns that choice.
uk = [
  "policyengine[uk]==5.3.0",
]
simulation = [
  "policyengine[uk]==5.3.0",
]
dev = [
  "pytest>=8.0",
  # Only needed to regenerate the ONS input table from the published workbook
  # (scripts/extract_ons_a6.py); the committed CSV is read with the stdlib.
  "openpyxl>=3.1",
]

[project.scripts]
iran-impact-build = "iran_impact.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iran_impact"]

[tool.pytest.ini_options]
testpaths = ["tests"]
